version: 1
name: MusicBrainz
slug: musicbrainz
summary: >-
  Search and browse the MusicBrainz music encyclopedia, fetch cover art, and
  submit your own tags, ratings, and collections
env:
  - name: MUSICBRAINZ_USER_AGENT
    required: false
    help: >-
      Optional override for the User-Agent sent to MusicBrainz.
  - name: MUSICBRAINZ_OAUTH_CLIENT_ID
    secret: true
    required: false
    help: >-
      OAuth client ID (write tools only). Register at
      musicbrainz.org/account/applications.
  - name: MUSICBRAINZ_OAUTH_CLIENT_SECRET
    secret: true
    required: false
    help: >-
      OAuth client secret (write tools only).
  - name: MUSICBRAINZ_OAUTH_REFRESH_TOKEN
    secret: true
    required: false
    help: >-
      OAuth refresh token with tag/rating/collection scopes (enables the write
      tools).
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    - coverartarchive.org
    - musicbrainz.org
examples:
  - prompt: >-
      List every studio album Radiohead has released, in order, with the year
      each came out.
    note: Searches for the artist, then browses its release groups.
  - prompt: >-
      Show me the front cover art for Fleetwood Mac's Rumours.
    note: Finds the release group, then fetches Cover Art Archive images.
  - prompt: >-
      Who wrote the song "Hallelujah", and which artists have recorded it?
    note: Looks up the work with its writer and recording relationships.
