version: 1
name: MusicBrainz
slug: musicbrainz
summary: >-
  Search and browse the MusicBrainz music encyclopedia, fetch cover art, and
  submit your own tags, ratings, and collections
env:
  - name: MUSICBRAINZ_USER_AGENT
    required: false
    help: >-
      Optional override for the User-Agent sent to MusicBrainz.
  - name: MUSICBRAINZ_OAUTH_CLIENT_ID
    secret: true
    required: false
    help: >-
      OAuth client ID (write tools only). Register at
      musicbrainz.org/account/applications.
  - name: MUSICBRAINZ_OAUTH_CLIENT_SECRET
    secret: true
    required: false
    help: >-
      OAuth client secret (write tools only).
  - name: MUSICBRAINZ_OAUTH_REFRESH_TOKEN
    secret: true
    required: false
    help: >-
      OAuth refresh token with tag/rating/collection scopes (enables the write
      tools).
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    - coverartarchive.org
    - musicbrainz.org
